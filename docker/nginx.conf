# nginx für das statische Portfolio. TLS übernehmen Cloudflare und Traefik, hier nur HTTP auf :80.

# Datensparsamkeit: keine Zugriffsprotokolle (siehe Datenschutzerklärung).
access_log off;
error_log /dev/stderr error;
server_tokens off;

map $sent_http_content_type $cache_control {
  default                    "public, max-age=3600";
  ~^text/html                "no-cache";
  ~^application/pdf          "public, max-age=86400";
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hinter Cloudflare + Traefik kommt die Weiterleitung schon als https an.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain;

  add_header Cache-Control $cache_control always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  # Astro inlinet kleine Skripte und Styles, daher 'unsafe-inline'. Fremde Quellen gibt es keine.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # Gehashte Build-Dateien ändern nie ihren Inhalt.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Alte URLs (bis 2. November 2026 war Englisch die Standardsprache, Deutsch unter /de/).
  location ^~ /de/ {
    rewrite ^/de/(.*)$ /$1 permanent;
  }
  location = /de {
    return 301 /;
  }
  location ^~ /projects/ {
    rewrite ^/projects/(.*)$ /en/projects/$1 permanent;
  }
  location ~ ^/(legal-notice|privacy)/?$ {
    return 301 /en/$1/;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
